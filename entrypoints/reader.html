<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Saved article · MeshCache</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="document">
    <header class="brand">
      <span class="logo" aria-hidden="true">m</span><strong>MeshCache</strong
      ><span id="copy-label" class="local-label">Saved copy</span>
    </header>
    <main>
      <p id="status" class="status" role="status" aria-live="polite">
        Loading your copy…
      </p>
      <h1 id="title"></h1>
      <div id="meta" class="meta"></div>
      <a id="source" class="back-link" hidden rel="noreferrer" target="_blank"
        >Open original article</a
      >
      <p class="quiet" id="copy-note" hidden>
        Formatting checked. Compare with the original when accuracy matters.
      </p>
      <section id="ratings" hidden>
        <p id="rating-summary" class="quiet"></p>
        <div class="actions">
          <button id="helpful" class="small-button">Helpful copy</button
          ><button id="incomplete" class="small-button">Incomplete copy</button
          ><button id="refresh-ratings" class="small-button">
            Check ratings
          </button>
        </div>
        <details>
          <summary>Rating privacy</summary>
          <p class="quiet">
            Ratings are public. Your signing key links your ratings across
            copies.
          </p>
        </details>
      </section>
      <hr hidden id="divider" />
      <article id="article" class="article"></article>
    </main>
    <script type="module" src="/src/reader.js"></script>
  </body>
</html>
